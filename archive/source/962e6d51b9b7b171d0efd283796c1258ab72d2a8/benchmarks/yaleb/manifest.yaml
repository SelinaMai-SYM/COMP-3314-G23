source_publication: >
  A.S. Georghiades, P.N. Belhumeur, and D.J. Kriegman, From Few to Many:
  Illumination Cone Models for Face Recognition under Variable Lighting and
  Pose, IEEE TPAMI 23(6):643-660, 2001. The cropped images are described by
  K.C. Lee, J. Ho, and D.J. Kriegman, Acquiring Linear Subspaces for Face
  Recognition under Variable Lighting, IEEE TPAMI, 2005. This file is Deng
  Cai's processed matrix, described on
  http://www.cad.zju.edu.cn/home/dengcai/Data/FaceData.html and
  http://www.cad.zju.edu.cn/home/dengcai/Data/YaleB/images.html as Extended
  Yale Face Database B at 32x32.
