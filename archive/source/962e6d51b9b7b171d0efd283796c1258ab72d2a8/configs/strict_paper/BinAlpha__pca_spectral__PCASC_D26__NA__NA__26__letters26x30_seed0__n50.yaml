track: STRICT_PAPER
method: pca_spectral
dataset: BinAlpha
dataset_version: letters26x30_seed0
dataset_identity_status: CANDIDATE_BIN_ALPHA
factor: PCASC_D26
paper_fidelity_category: A_PAPER_FAITHFUL
n_trials: 50
trial_seed_start: 0
timeout_seconds: 1800
params:
  k: 5
  bandwidth_rule: median_positive_knn_squared_distance
  symmetrization: union
  row_normalize: false
  laplacian: symmetric_normalized_eq4
  kmeans_init: random
  n_init: 1
  n_components: 26
notes: PCA-SC shared Eq.4 on PCA(26); not sklearn SpectralClustering
label_informed_selection: false
protocol: strict_paper_no_ACC_selection
selection_rule: 'main cell: prespecified Track-B-like dim=min(50,K,n-1,d) labeled
  ASSUMPTION; full {10,20,...,150} grid saved and clipped by rank; optional diagnostic
  uses lowest K-means inertia, never ACC'
hardware_note: 8 CPU / 16 GB
