preprocessing_operations: >
  No resize is applied by this loader. fea is uint8 (2414, 1024) with values
  0..255, already 32x32 as stored. Divide by 255. Keep the stored vector
  order. gnd values 1..38 are mapped to 0..37.
sample_selection_method: "all 2414 rows; no row was dropped"
random_seed: unknown
known_deviations: >
  Approximate relative to a from-scratch resize of the UCSD cropped PGMs.
  On 2026-10-20 these URLs returned HTTP 404:
  http://vision.ucsd.edu/extyaleb/CroppedYaleBZip/CroppedYale.zip,
  http://vision.ucsd.edu/~leekc/ExtYaleDatabase/CroppedYaleBZip/CroppedYale.zip,
  http://vision.ucsd.edu/~iskwak/ExtYaleDatabase/CroppedYaleBZip/CroppedYale.zip,
  and http://vision.caltech.edu/~greg/ee148_spring2008/CroppedYale.zip.
  The literature describes those cropped images as 168x192 (or 192x168).
  This mat is already 32x32, so the resize kernel is unknown and was not
  applied here. Measured per-class counts for gnd 1..38 are 64,64,64,64,64,
  64,64,64,64,64,60,59,60,63,62,63,63,64, and 64 for gnd 19..38. The total
  2414 and 38 classes match the paper. The paper's interpolation is still
  unspecified. No random seed was used.
verification_status: approximate
