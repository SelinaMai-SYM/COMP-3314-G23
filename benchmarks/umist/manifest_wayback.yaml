original_feature_dimension: unknown
processed_feature_dimension: unknown
preprocessing_operations: >
  Not stacked. 1013 tar members end in .pgm, 1012 unique names (1t/1t052.pgm
  is stored twice), 20 directories 1a..1t, 122 distinct shapes. The most
  common shape is (196, 170) with 71 images. Pixel range across images is
  0..238. A rectangular feature matrix was not built.
sample_selection_method: "not selected; the file is not the 564-image set"
random_seed: unknown
known_deviations: >
  The page text says 564 images. The gzip linked from that page, as captured
  by the Internet Archive on 2005-04-03, contains 1012 unique PGM files.
  This archive is not accepted as the exact paper set. The live host
  returned HTTP 502. Lincoln eprints returned HTTP 202 with an AWS WAF
  challenge. load_dataset("UMIST") still raises DatasetUnavailable.
  version='uncropped1012' also raises, because the shapes are not uniform.
