mathematics:
  fidelity: 0.5 ||G-H||_F^2
  lambda: Single-undirected-edge TV coefficient, distinct from historical gamma
  movement: '||G-H||_F / ||H-mean(H)||_F'
  rounding: G directly without output normalization
  QSSC: quadratic fidelity + lambda TV_W0(G)
  E1_v2: quadratic fidelity + lambda sum w max(||BG||-eta||BH||,0)
  E4: QSSC on one frozen constrained degree-preserving graph correction
  E5: quadratic fidelity + lambda(1+alpha)TV(G)+lambda alpha TV(G-H)-lambda alpha
    TV(H)
  E6: quadratic fidelity on retained Z with sym(Y^T Z)>=eta_dir Sigma^2 and centering
parameters:
  eta: 0.25
  beta: 1.0
  graph_mix: 0.25
  graph_a_budget: 1.05
  alpha: 1.0
  eta_dir: 0.5
  reference_lambda: 2*historical_gamma_effective
  reference_certificate_relative_gap: 1.0e-05
  reference_capacity_tolerance: 1.0e-08
targets:
  primary: 0.05
  secondary_in_order:
  - 0.02
  - 0.1
  - 0.2
  matching_relative_tolerance: 0.05
  max_movement_uncertainty_relative_to_target: 0.02
search:
  start: .02*S_H/||B^T(w BH/||BH||)||_F, zero directions at coincident edges
  doublings_or_halvings_max_per_target: 8
  log_refinements_max_per_target: 6
  distinct_lambda_max_per_main_path: 32
  brackets: Only movement uncertainty intervals; never ACC/NMI
  warm_start: Nearest existing label-free path; E6 may project same-cohort QSSC checkpoint
    into retained coordinates
  finite_failure_endpoint: Last finite point, with actual movement and unqualified
    status
graph:
  k_original: 5
  candidate_k: 20
  ties: Distance then original row index; blockwise, no dense USPS matrix
  bandwidth: Existing median positive directed-neighbor squared distances
  symmetrization: union maximum
  raw_spectral_seed: 20261108
  aux_shift: 4
  aux_which: SA
  aux_eigen_residual_tolerance: 1.0e-07
  cutoff_ambiguity_threshold: 1.0e-08
  r_floor: 1.0e-06
  QP_eps_abs: 1.0e-09
  QP_eps_rel: 1.0e-09
  QP_polishing: true
  QP_max_iterations: 200000
  QP_relative_gap: 1.0e-06
  QP_degree_and_budget_tolerance: 1.0e-08
  nonnegative_roundoff_projection: Disclosed, followed by full residual checks; no
    row normalization; keep exact W0 safe upper bound
  QP_bound_qualification: Numerical, not interval arithmetic; approximate candidates
    never called exact upper bounds
solver:
  method: Sparse PDHG with quadratic prox; original unweighted incidence and external
    edge weights
  standard_steps: tau_i=.99/(blocks*degree_i), sigma_B=.495; E5 uses two blocks when
    alpha>0
  E6_steps: tau=.99, sigma_B=.4/(2 max_degree), sigma_T=.4/sigma_max(Y)^2
  max_iterations: 200000
  check_every: 50
  checkpoint_every: 1000
  relative_gap_tolerance: 1.0e-06
  relative_capacity_tolerance: 1.0e-08
  negative_gap_roundoff_tolerance: 1e-12*max(1,abs(P),abs(D)); preserve raw signed
    gaps
  stable_vs_subtracted_gap_tolerance: 1e-9*max(1,abs(P),abs(D))
  rank_tolerance: max(n,K)*float64_epsilon*sigma_max
  E6_repair_margin: 1.0e-10
  E6_whitened_feasibility_tolerance: 1.0e-08
  E6_conditioning_indicator: 50*epsilon*max(n,K)*condition_number; flag above 1e-8
budget:
  wall_hours: 24
  opening_audit_accounting: Clock conservatively backdated thirty minutes at initialization
  workers: 2
  threads_per_worker: 1
  RSS_target_GiB: 8
