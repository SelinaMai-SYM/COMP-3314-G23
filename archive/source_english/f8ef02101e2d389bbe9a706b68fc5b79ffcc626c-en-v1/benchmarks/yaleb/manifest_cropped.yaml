preprocessing_operations: >
  The zip contains 2452 PGM files in 38 subject folders (yaleB01-yaleB13 and
  yaleB15-yaleB39; yaleB14 is absent) plus 18 files ending in .pgm.bad.
  38 filenames contain Ambient: 10 of those are 192x168 and 28 are 480x640.
  The other 2414 PGM files are all uint8 with shape (192, 168), width 168
  and height 192 in the PGM header, pixel range 0..255. Those 2414 images
  are resized to 32x32 with PIL nearest, bilinear, and bicubic, divided by
  255, and vectorized in C order. cropped2414 uses bilinear.
sample_selection_method: >
  Non-ambient PGM only, sorted by subject number then filename. Per-class
  counts in that order are 64 ten times, then 60, 59, 60, 63, 62, 63, 63,
  then 64 for the remaining classes. That histogram matches the counts
  already recorded for Deng Cai gnd 1..38. Pixel identity with
  YaleB_32x32.mat was not established.
random_seed: unknown
known_deviations: >
  Live UCSD CroppedYale.zip URLs returned HTTP 404 on 2026-10-20. This file
  is an Internet Archive capture of the official zip, not a fresh UCSD
  response. The zip itself is not 2414 images; 2414 is the non-ambient PGM
  count. load_dataset("YaleB") still returns YaleB_32x32.mat.
