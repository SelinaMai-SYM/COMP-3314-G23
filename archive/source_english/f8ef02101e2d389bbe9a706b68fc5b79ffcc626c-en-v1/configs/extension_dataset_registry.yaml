# Locked before extension accuracies were computed.
# Labels are used only for final ACC/NMI and for the separated YaleB diagnostics.

datasets:
  - name: ORL
    version: att92
    eligibility: PAPER_RECONSTRUCTION
    run: true
    notes: AT&T 92x112 release resized to 32x32 bilinear. Not an unidentified third crop.
  - name: JAFFE
    version: zenodo
    eligibility: VERIFIED_SOURCE
    run: true
    notes: Official Zenodo zip, resized by the existing loader.
  - name: YaleB
    version: cropped2414
    eligibility: PRIMARY_YALEB_VERSION
    run: true
    notes: 2414 non-ambient PGM images resized bilinear to 32x32. Same benchmark as dengcai32, not a second paper dataset.
  - name: YaleB
    version: dengcai32
    eligibility: ALTERNATE_MATRIX_NOT_AN_INDEPENDENT_BENCHMARK
    run: true
    notes: Deng Cai 32x32 mat. Different pixels from cropped2414. Reported beside it, not as a second independent benchmark.
  - name: USPS
    version: libsvm
    eligibility: VERIFIED_SOURCE
    run: true
    notes: LIBSVM usps + usps.t.
  - name: BinAlpha
    version: CANDIDATE_BIN_ALPHA
    eligibility: NON_EXACT_DATASET
    run: true
    notes: Documented 26x30 seed-0 reconstruction. Not the paper sample set.
  - name: UMIST
    version: precropped575
    eligibility: NON_EXACT_DATASET
    run: true
    notes: 575-image pre-cropped release, not the paper's 564.
  - name: MSRA50
    eligibility: EXCLUDED
    run: false
    status: BLOCKED_DATA
    notes: No archive. Not run.
  - name: AR
    eligibility: BLOCKED
    run: false
    status: BLOCKED
    called_paper_ar: false
    called_AR100_ZENODO: false
    checks:
      license: failed_official_redistribution_not_obtained
      labels: failed_100_identities_not_120
      images: failed_third_party_bmp_not_martinez_raw
      single_preprocessing_rule: failed_840_of_120_not_specified
    notes: Third-party Zenodo zip stays unloaded. It is not paper AR.
