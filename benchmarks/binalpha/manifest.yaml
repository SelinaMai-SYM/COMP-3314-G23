known_deviations: >
  Chang et al. state that BinAlpha contains 26 binary handwritten alphabets
  and that they randomly select 30 images for every alphabet. They cite no
  source, give no image size, and give no random seed. No public file with
  that exact selection was found on 2026-10-20. Binary Alphadigits (Sam
  Roweis / Simon Lucas; 36 classes of digits and capital letters, 39 images
  each, 20x16) was identified and was not substituted. Because the parent
  pool and seed are unknown, the paper's 780-image subset cannot be
  reconstructed from a larger alphabet set.
