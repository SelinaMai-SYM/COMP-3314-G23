methods:
  kmeans:
    fidelity: STANDARD_BASELINE
    clustering: lloyd
  sc:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    clustering: kmeans_on_shared_F
  pca_kmeans:
    fidelity: STANDARD_BASELINE
    clustering: kmeans_on_pca_scores
    dimension_rule: grid_10_to_150_step_10_no_cross_dimension_inertia
  pca_sc:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    clustering: kmeans_on_spectral_embedding_of_pca_scores
  lda_kmeans:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    source: Ding and Li, ICML 2007
    dimensions: K-1
    refit: full_algorithm_each_seed
  lda_sc:
    fidelity: BLOCKED_METHOD
    reason: Chang et al. name LDA-SC and do not define it.
  llc:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    clustering: yu_shi_discretization
    legacy: PRE_FIX_LEGACY measurements are not reused
  spls:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    form: Hou et al. one-shot Eqs. 18-19
    clustering: kmeans
    not_run: ncut stage and beta>0 alternation are not the experimental one-shot
  ssc:
    fidelity: PAPER_BASED_REIMPLEMENTATION
    variants: [E8, E13]
    note: E8 and E13 are one historical method with two explicit reconstructions.
