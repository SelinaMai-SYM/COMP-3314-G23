dataset_name: MSRA50
source_url: unknown
source_publication: >
  Chang et al. (AAAI 2015) name MSRA50 but cite no source. He, Yan, Hu,
  Niyogi, and Zhang, Face Recognition Using Laplacianfaces, IEEE TPAMI 2005,
  describe a face collection made at Microsoft Research Asia with 12 people,
  64 to 80 frontal images per person in each of two sessions, cropped to
  32x32. That paper does not state a total of 1799 and does not give a
  download URL. The name MSRA50 and the count 1799 are not established as
  that file.
