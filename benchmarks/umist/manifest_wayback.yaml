source_publication: >
  D.B. Graham and N.M. Allinson, Characterising virtual eigensignatures for
  general purpose face recognition, in Face Recognition: From Theory to
  Applications, NATO ASI Series F, 1998. The 2001-04-05 Wayback copy of
  http://images.ee.umist.ac.uk/danny/database.html calls this the UMIST Face
  Database and says it consists of 564 images of 20 people.
