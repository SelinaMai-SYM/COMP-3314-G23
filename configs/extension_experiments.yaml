# Primary comparison and the secondary gamma grid.
# Nothing in this file is selected by test ACC.

control:
  method: SSC
  variant: E8
  laplacian_coefficient: 2
  not_the_default_solver: E13
  gamma: 1.0
  k: 5
  g_init: F
  kmeans_init: random
  kmeans_algorithm: lloyd
  n_init: 1
  seeds: [0, 49]
  tol: 1.0e-6
  max_iter: 300
  zero_residual_floor: median_pairwise
  bandwidth_rule: median_positive_knn_squared_distance
  symmetrization: union
  row_normalize: false
  laplacian: symmetric_normalized_eq4
  label_use: final_ACC_NMI_only

gamma_grid: [1.0e-6, 1.0e-3, 1.0, 1.0e3, 1.0e6]
gamma_grid_rule: record every value; do not pick one by ACC
oracle_upper_bound: highest ACC on the grid is labeled ORACLE_UPPER_BOUND in the analysis and is not an unsupervised result

extensions:
  - E01
  - E02
  - E03-A
  - E03-W
  - E03-AW
  - E04-degree
  - E04-total
  - E05-fuse
  - E05-bilateral
  - E06
  - E07-random
  - E07-kmeanspp
  - E07-inertia_best
  - E07-consensus
  - E08
  - E09
internal_variants_are_not_extra_research_methods: true
auxiliary: mutual_knn_E8
match_tolerance:
  atol: 1.0e-5
  rtol: 1.0e-5
  when: alpha is 1 and W is the original union-kNN affinity, G matches shrink_embedding variant E8
solver: SSC_method.optimizer.solve_spd_system
output_runs: runs/extension_research
do_not_overwrite:
  - runs/strict_paper
  - runs/final_round
