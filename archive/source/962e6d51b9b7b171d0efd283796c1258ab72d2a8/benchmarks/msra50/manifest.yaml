dataset_name: MSRA50
source_url: unknown
source_publication: >
  Chang et al. (AAAI 2015) name MSRA50, state 1799 images and 12 classes
  resized to 32x32, and cite no source. Chang, Nie, Yang et al.,
  "Improved Spectral Clustering via Embedded Label Propagation"
  (arXiv:1411.6241, 2014) write "The MSRA50 dataset (He et al. 2004)
  consists of 1799 images and 12 classes" and list matrix size 1024.
  Their bibliography entry "He et al. 2004" is Face Recognition Using
  Laplacianfaces, IEEE TPAMI 27(3):328-340, which is the 2005 journal
  paper. He, Yan, Hu, and Zhang, ICCV 2003, and He, Yan, Hu, Niyogi, and
  Zhang, TPAMI 2005, describe an MSRA collection of 12 people, 64 to 80
  frontal images per person in each of two sessions, cropped to 32x32.
  Those papers do not print 1799 and do not give a download URL.
