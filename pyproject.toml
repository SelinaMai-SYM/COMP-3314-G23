[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "comp3314-ssc"
version = "1.0.0"
description = "A reproducible study of Spectral Shrunk Clustering, source sensitivity, and graph refinement."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
    "Pillow",
    "threadpoolctl",
]

[project.optional-dependencies]
test = ["pytest"]
reference = ["cvxpy"]

[tool.setuptools.packages.find]
include = ["SSC_method*", "benchmarks*", "baselines*", "method_extension*", "experiments*", "scripts*"]

[tool.setuptools.package-data]
"baselines.lda_kmeans.vendor.clustpy" = ["LICENSE", "PROVENANCE.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "baselines", "benchmarks"]
pythonpath = ["."]
