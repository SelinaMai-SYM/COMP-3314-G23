# Extension protocol values

These lists are the grids in experiments/v3_theory/run_campaign.py.
They were not changed after looking at accuracy.

paper_gamma: [1.0e-6, 1.0e-3, 1.0, 1.0e3, 1.0e6]
x1_multipliers: [0.1, 0.5, 1.0, 2.0, 10.0, 100.0]
x3_grid: [1.0e-3, 1.0e-2, 1.0e-1, 1.0, 10.0, 100.0]
betas: [0.0, 0.5, 1.0, 2.0]
alphas: [0.0, 0.5, 1.0, 2.0]
scales: [3, 5, 10, 15]
reference_gamma: 1.0
epsilon: 0.05
primary_kmeans: sklearn_greedy_kmeanspp
seeds: 0..49
n_init: 1
algorithm: lloyd
primary_contrasts:
  - X1_multiplier_1_vs_ssc_gamma_1
  - X2_beta_1_vs_beta_0
  - X3_mass_tau_1_vs_original_gamma_1
  - X4_multi_vs_k5
  - X5_alpha_1_vs_alpha_0
