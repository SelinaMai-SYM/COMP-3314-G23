original_sample_count: 213
selected_sample_count: 213
number_of_classes: 10
original_feature_dimension: 65536
processed_feature_dimension: 676
preprocessing_operations: >
  Read 213 TIFF files from jaffe.zip. All are 256x256. 190 are mode L and 23
  are grayscale palette mode P (checked: R=G=B), converted with
  PIL Image.convert("L"). Resize each uint8 image to 26x26 with PIL bilinear,
  divide by 255, and vectorize in C order. No augmentation.
sample_selection_method: "all 213 TIFFs, sorted by filename; subject id is the sorted two-letter poser code"
random_seed: unknown
known_deviations: >
  The paper says to resize to 26x26 but does not name the interpolation.
  Bilinear is this loader's choice. Poser codes and integer ids: KA=0, KL=1,
  KM=2, KR=3, MK=4, NA=5, NM=6, TM=7, UY=8, YM=9. Observed images per poser:
  KA 23, KL 22, KM 22, KR 20, MK 21, NA 21, NM 20, TM 21, UY 21, YM 22.
  The paper does not state a random seed; none was used. Raw images must not
  be committed.
verification_status: verified
