notes:
  - UMIST deduplication plus an unknown omission requires two declared preparation assumptions.
  - Random stratification includes an assumed quota rule and an assumed draw.
  - BinAlpha random selection itself is specified by the paper; its unknown seed is not an extra protocol deviation.
  - All historical source identities remain unverified regardless of this tie score.
  - Published-grid gamma values and random kmeans++ variants are not penalized merely for differing from the reference gamma1/random setting.
