known_deviations: >
  12 people times two sessions times 64-80 images is 1536-1920, so 1799
  is arithmetically possible. Matching that range is not identity.
  Deng Cai's data.html (HTTP 200 on 2026-10-21) has no MSRA50 file.
  MSRA-B, MSRA10K, MSRA-CFW, and MSRA-TD500 were not downloaded.
