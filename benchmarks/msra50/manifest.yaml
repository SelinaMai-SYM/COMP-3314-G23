known_deviations: >
  Chang et al. state 1799 images, 12 classes, resized to 32x32, with pixel
  features. No archive with those measured counts was downloaded. Unofficial
  .mat bundles posted on CSDN were not used. MSRA-B, MSRA10K, MSRA-CFW, and
  MSRA-TD500 are different datasets and were not substituted. The official
  cropped Extended Yale B and other face sets were not renamed to MSRA50.
