license_information: >
  The 2015 ExtYaleB page says the extended database may be used for research
  and asks publications to acknowledge it and cite Georghiades, Belhumeur,
  and Kriegman, PAMI 2001. Publications that use the cropped images are also
  asked to cite Lee, Ho, and Kriegman, PAMI 2005. The Yale Face Database B
  page says images cannot be incorporated into another publicly distributed
  database without permission from Yale University. The zip is gitignored
  under benchmarks/yaleb/data/.
