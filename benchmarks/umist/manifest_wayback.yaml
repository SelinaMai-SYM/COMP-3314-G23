license_information: >
  The 2001 UMIST page says only images of subject 1a may be published, and
  only with written permission; users should cite Graham and Allinson 1998
  and notify Daniel Graham or Nigel Allinson. The archives are gitignored
  under benchmarks/umist/data/.
