license_information: >
  Extended Yale B is free for research use. Publications should acknowledge
  the database and cite Georghiades, Belhumeur, and Kriegman, PAMI 2001; the
  cropped release additionally cites Lee, Ho, and Kriegman, PAMI 2005. Deng
  Cai asks users of this processed file to cite his face-recognition papers.
  Yale's terms restrict incorporating the images into another publicly
  distributed database. The mat is gitignored. The UCSD cropped PGM zip was
  not the file downloaded.
